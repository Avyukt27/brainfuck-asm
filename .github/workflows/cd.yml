name: Build and Deploy Binary

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Build binary
        run: make build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: quadfuck
          path: build/main

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: quadfuck
          path: .
      - name: Create Release
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --latest=true './quadfuck#QuadFuck Interpreter'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
