name: Build and Deploy Binary

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Build binary
        run: make build
      - name: Create Release
        run: |
          gh release create "$GITHUB_REF_NAME" './build/main#QuadFuck Interpreter' --generate-notes --latest=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
